[project]
name = "benefura-api"
version = "0.1.0"
description = "Benefura API: privacy-first benefits assistant on Microsoft Foundry"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.135",
  "uvicorn[standard]>=0.35",
  "python-multipart>=0.0.20",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "httpx>=0.28",
  "azure-identity>=1.25",
  "azure-ai-projects>=2.6,<2.7",
  "agent-framework-core==1.18.0",
  "agent-framework-foundry==1.13.0",
  "azure-ai-contentunderstanding>=1.1,<1.2",
  "azure-ai-contentsafety>=1.0,<1.1",
  "azure-search-documents>=12.0,<12.1",
  "azure-monitor-opentelemetry>=1.8,<1.9",
  "opentelemetry-instrumentation-fastapi>=0.60b0",
  "azure-data-tables>=12.7",
  "rapidfuzz>=3.14",
  "pyyaml>=6.0",
  "pypdf>=6.0",
  "pillow>=11.0",
  "opentelemetry-sdk>=1.44",
  "aiohttp>=3.14",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "respx>=0.22",
  "ruff>=0.16",
  "pyright>=1.1.410",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"]

[tool.pyright]
pythonVersion = "3.12"
include = ["app", "scripts"]
typeCheckingMode = "standard"
