name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.12"

jobs:
  api:
    name: api (ruff, pyright, pytest, openapi drift)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      # setup-uv stopped publishing floating major tags after v7, so this pins the release.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest

      - name: openapi.json drift
        run: uv run python -m scripts.export_openapi --check

  web:
    name: web (types, lint, vitest, build, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Playwright starts the API with AI_MODE=fake, so the web job needs uv as well.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install API (fake mode for e2e)
        working-directory: apps/api
        run: uv sync --locked

      - name: Generated API types are current
        working-directory: apps/web
        run: pnpm gen:check

      - name: Typecheck
        working-directory: apps/web
        run: pnpm typecheck

      - name: Lint
        working-directory: apps/web
        run: pnpm lint

      - name: Vitest
        working-directory: apps/web
        run: pnpm test

      - name: Build (static export + staticwebapp.config.json)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: pnpm build

      - name: Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright e2e (fake API)
        working-directory: apps/web
        env:
          AI_MODE: fake
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

  python-packages:
    name: ${{ matrix.package }} (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [knowledge, evals, samples]
    steps:
      - uses: actions/checkout@v7

      - name: Check for pyproject.toml
        id: present
        run: |
          if [ -f "${{ matrix.package }}/pyproject.toml" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.package }}/pyproject.toml not found; skipping."
          fi

      - uses: astral-sh/setup-uv@v10.1.0
        if: steps.present.outputs.present == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: ${{ matrix.package }}/uv.lock

      - name: Install
        if: steps.present.outputs.present == 'true'
        run: |
          if [ -f "${{ matrix.package }}/uv.lock" ]; then
            uv sync --project "${{ matrix.package }}" --locked
          else
            uv sync --project "${{ matrix.package }}"
          fi

      # Run from the repo root so `import knowledge.*` / `evals.*` / `samples.*` resolves.
      - name: Pytest
        if: steps.present.outputs.present == 'true'
        run: uv run --project "${{ matrix.package }}" python -m pytest "${{ matrix.package }}"

  bicep:
    name: infra (bicep build + lint, private networking variant, workbook drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Bicep
        run: az bicep install && az bicep version

      - name: Workbook JSON is current
        run: python3 infra/scripts/gen_workbook.py --check

      - name: Build and lint (fail on warnings)
        run: |
          set -o pipefail
          status=0
          for f in infra/main.bicep infra/modules/*.bicep; do
            echo "::group::$f"
            az bicep build --file "$f" --stdout > /dev/null 2> build.log || status=1
            az bicep lint --file "$f" 2> lint.log || status=1
            cat build.log lint.log
            if grep -Eq "(Warning|Error) " build.log lint.log; then status=1; fi
            echo "::endgroup::"
          done
          exit $status

      - name: Parameter files (demo + enablePrivateNetworking=true)
        run: |
          status=0
          for p in infra/params/*.bicepparam; do
            echo "::group::$p"
            az bicep build-params --file "$p" --stdout > /dev/null 2> params.log || status=1
            cat params.log
            if grep -Eq "(Warning|Error) " params.log; then status=1; fi
            echo "::endgroup::"
          done
          exit $status

      - name: SWA config generator
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          SWA_OUT_DIR="$RUNNER_TEMP/out" NEXT_PUBLIC_API_BASE_URL="https://api.example.test" node apps/web/scripts/write-swa-config.mjs
          jq -e '.globalHeaders["Content-Security-Policy"] | contains("connect-src '"'"'self'"'"' https://api.example.test")' "$RUNNER_TEMP/out/staticwebapp.config.json"
