[project]
name = "benefura-evals"
version = "0.1.0"
description = "Benefura evaluation harness, datasets, custom evaluators, Foundry cloud evals and red teaming"
requires-python = ">=3.12,<3.13"
dependencies = [
  "benefura-api",
  "httpx>=0.28",
  "pyyaml>=6.0",
  "azure-ai-evaluation[redteam]>=1.13",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "respx>=0.22",
  "ruff>=0.16",
]

[tool.uv.sources]
benefura-api = { path = "../apps/api", editable = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# Repo root on sys.path so `evals.*` imports with `evals/` as a namespace package.
[tool.hatch.build]
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel]
packages = ["harness", "custom"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["evals", "app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
